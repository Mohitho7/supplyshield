<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="shieldGradLogo" x1="4" y1="4" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b2a37"/>
      <stop offset="100%" stop-color="#0c141a"/>
    </linearGradient>
    <linearGradient id="goldGradLogo" x1="8" y1="12" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#e6b72e"/>
    </linearGradient>
    <filter id="glowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#e6b72e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield Icon -->
  <g transform="translate(4, 4)">
    <path d="M20 3L6 8.5V18.5C6 27.5 12.2 35 20 37.2C27.8 35 34 27.5 34 18.5V8.5L20 3Z" 
          fill="url(#shieldGradLogo)" 
          stroke="url(#goldGradLogo)" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    <path d="M12 18.5L17.5 24L28.5 11.5" 
          stroke="url(#goldGradLogo)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowLogo)"/>
    <circle cx="12" cy="18.5" r="2.2" fill="#ffd54f"/>
    <circle cx="17.5" cy="24" r="2.2" fill="#ffd54f"/>
    <circle cx="28.5" cy="11.5" r="2.2" fill="#ffd54f"/>
    <path d="M17.5 24L20 30" stroke="#66d6b2" stroke-width="1.6" stroke-dasharray="2 2"/>
    <circle cx="20" cy="30" r="1.8" fill="#66d6b2"/>
  </g>

  <!-- Typography -->
  <g transform="translate(52, 10)">
    <text x="0" y="19" font-family="'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#ffffff" letter-spacing="0.04em">
      SupplyShield <tspan fill="#e6b72e" font-weight="700">AI</tspan>
    </text>
    <text x="0" y="32" font-family="'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" fill="#81939e" letter-spacing="0.14em">
      SUPPLY CHAIN RESILIENCE
    </text>
  </g>
