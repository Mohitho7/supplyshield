<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b2a37"/>
      <stop offset="100%" stop-color="#0c141a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="8" y1="10" x2="24" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#e6b72e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#e6b72e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M16 2.5L4.5 7V15C4.5 22.2 9.5 28.2 16 30C22.5 28.2 27.5 22.2 27.5 15V7L16 2.5Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>

  <!-- Resilient Supply Network Links & Checkmark Path -->
  <path d="M9.5 15L14 19.5L23 9.5" 
        stroke="url(#goldGrad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Network Nodes -->
  <circle cx="9.5" cy="15" r="1.8" fill="#ffd54f"/>
  <circle cx="14" cy="19.5" r="1.8" fill="#ffd54f"/>
  <circle cx="23" cy="9.5" r="1.8" fill="#ffd54f"/>

  <!-- Downstream Fulfillment Pulse Node -->
  <path d="M14 19.5L16 24.5" stroke="#66d6b2" stroke-width="1.4" stroke-dasharray="1.5 1.5"/>
  <circle cx="16" cy="24.5" r="1.4" fill="#66d6b2"/>
</svg>